<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mobility Care - Mapa de acessibilidade</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
        <style>
            body {margin: 0; display: flex; font-family: sans-serif; height: 100vh;}
            #map {flex-grow: 1; height: 100%;}
            #sidebar {width: 300px; padding: 20px; background: #f4f4f4; overflow-y: auto; box-shadow: -2px 0 5px rgba(0, 0, 0, 0.1);}
            .alert {padding: 10px; background: #fff3cd; border: 1px  solid #ffeeba; border-radius: 5px; margin-bottom: 10px;}
            h2 {color: #2c3e50;}
        </style>
    </head>
    <body>

        <div id="sidebar">
            <h2>♿ Mobility Care </h2>
            <div id="info">
            <p>Clique em dois pontos no mapa para traçar a rota.</p>
            </div>
        </div>
        <div id="map"></div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"> </script>
        <script>
            // Inicializa o mapa em Recife
            const map = L.map('map').setView([-8.0631, -34.8711], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
            attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map); 
            let markers = []; // Para guardar os pinos do mapa
            //2. Função que escuta o clique no mapa

            
            map.on('click', function(e){
                if (markers.length >=2){
                    markers.forEach(m => map.removeLayer(m));
                    markers = [];
                    document.getElementById('info').innerHTML = '';
                }
                // Adiciona um marcador onde o usuário clicou.

                const novoMarcador = L.marker(e.latlng).addTo(map);
                markers.push(novoMarcador);

                if (markers.length === 1) {
                    document.getElementById('info').innerHTML = '<p><b>Partida definida</b><br>Agora clique no destino.</p>';
                }
                //Se tiver duas marcas chamamos a API
                if (markers.length === 2) {
                    const origem = markers[0].getLatLng();
                    const destino = markers[1].getLatLng();

                    document.getElementById('info').innerHTML ='<p>Calculando rota acessível...</p>';
                    enviarParaAPI(origem, destino);
                }
            });
            async function enviarParaAPI(origem, destino) {
                const infoDiv = document.getElementById('info')
                infoDiv.innerHTML = '<p>⏳ Calculando rota acessível...</p>'
                try {
                    const res = await fetch('/api/v1/otimizar-rota',{
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        origem: {lat: origem.lat, lon: origem.lng},
                        destino: {lat: destino.lat, lon: destino.lng},
                        tipo_usuario: "pcd_cadeirante"
                    })
                });
                const data = await res.json();

                console.log("DADOS RECEBIDOS DO PYTHON:",data);

                if (data.status === "sucesso") {
                    if (window.rotaAtual){
                        map.removeLayer(window.rotaAtual);
                    }
                    if (data.geometria){
                        window.rotaAtual = L.geoJSON(data.geometria, {
                            style: {color: '#007bff', weight: 5, opacity: 0.7}
                        }).addTo(map);
                        //faz o mapa focar na rota inteira
                        map.fitBounds(window.rotaAtual.getBounds());
                    }
                    infoDiv.innerHTML = `
                    <div class="alert" style="background: #fff3cd; padding: 10px; border: 1px solid #ffeeba; margin-bottom: 10px;">
                        ${data.alerta_acessibilidade || "Trajeto calculado com sucesso."}
                    </div>    
                    <p><b>Distância:</b>${data.distancia_km || 0} km</p>
                    <p><b>Tempo:</b> ${data.duracao_min || 0} min</p>
                    <a href="${data.link_google_maps}"target"=_blank">Abrir no Google Maps</a>
                    <hr>
                    <h4>Passo a passo:</h4>
                    <ul style="font-size: 0.85em;">
                        ${data.passo_a_passo ? data.passo_a_passo.map(p => `<li>${p}</li>`).join(''): '<li>Sem instrução disponiveis.</li>'}
                        </ul>
                    `;
                } else {
                    infoDiv.innerHTML = `<p style="color: red;">Erro: ${data.detalhe || "Erro desconhecido"}</p>
                    `;          
                }   console.error("Erro retornado pela API: ", data);
            }catch (erro){
                console.error("ERRO NO FETCH: ", erro);
                infoDiv.innerHTML = `<p style="color: red;"> Erro de conexão com o servidor.</p>`;
            }        
        }
        </script>
    </body>
</html>
